<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Circle Radial Gradient -->
    <radialGradient id="bgCircle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#243048"/>
      <stop offset="60%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#0b101d"/>
    </radialGradient>

    <!-- Outer Gold / Orange Ring Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Inner Shield Orange / Amber Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e07000"/>
      <stop offset="50%" stop-color="#cc5a00"/>
      <stop offset="100%" stop-color="#a64400"/>
    </linearGradient>

    <!-- Shield Border Gold Gradient -->
    <linearGradient id="shieldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- D Letter Gradient -->
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <!-- Inner Glow Shadow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>

    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Dark Background Ring -->
  <circle cx="256" cy="256" r="248" fill="url(#bgCircle)" stroke="url(#goldBorder)" stroke-width="12" filter="url(#goldGlow)"/>
  
  <!-- Subtle Inner Golden Rim -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#fcd34d" stroke-width="2" opacity="0.6"/>

  <!-- Center Shield Outer Glow Shape -->
  <g filter="url(#shieldShadow)">
    <!-- Classic Crest / Shield Path -->
    <!-- Top flat with subtle center point, sides straight down, then tapering to a bottom point -->
    <path d="M 256 78 
             C 310 88, 360 82, 388 98 
             C 392 140, 396 220, 370 290 
             C 342 360, 290 410, 256 436 
             C 222 410, 170 360, 142 290 
             C 116 220, 120 140, 124 98 
             C 152 82, 202 88, 256 78 Z"
          fill="url(#shieldGrad)" 
          stroke="url(#shieldBorderGrad)" 
          stroke-width="8" 
          stroke-linejoin="round"/>

    <!-- Inner Shield Highlight Line -->
    <path d="M 256 94 
             C 304 102, 348 97, 372 110 
             C 376 148, 379 218, 356 280 
             C 330 342, 285 388, 256 414 
             C 227 388, 182 342, 156 280 
             C 133 218, 136 148, 140 110 
             C 164 97, 208 102, 256 94 Z"
          fill="none" 
          stroke="#fef08a" 
          stroke-width="2" 
          opacity="0.5"/>

    <!-- Top Shield Star / Accent -->
    <g transform="translate(256, 125)">
      <polygon points="0,-9 2.5,-3 8.5,-2.5 4,2 5.5,8 0,5 -5.5,8 -4,2 -8.5,-2.5 -2.5,-3" fill="#fef08a"/>
    </g>

    <!-- Stylized Serif Monogram 'D' in Shield -->
    <!-- Bold, elegant serif letter D -->
    <text x="256" y="265" 
          font-family="'Cinzel', 'Playfair Display', 'Times New Roman', 'Georgia', serif" 
          font-weight="900" 
          font-size="145" 
          fill="url(#letterGrad)" 
          text-anchor="middle"
          filter="drop-shadow(0px 3px 4px rgba(0,0,0,0.4))">D</text>

    <!-- Arabic Subtitle: شركة دريم / للتجارة والتوزيع inside shield -->
    <text x="256" y="325" 
          font-family="'Cairo', 'Amiri', system-ui, sans-serif" 
          font-weight="900" 
          font-size="21" 
          fill="#ffffff" 
          text-anchor="middle"
          letter-spacing="0.5"
          filter="drop-shadow(0px 2px 3px rgba(0,0,0,0.6))">شركة دريم</text>

    <text x="256" y="352" 
          font-family="'Cairo', system-ui, sans-serif" 
          font-weight="700" 
          font-size="14" 
          fill="#fef08a" 
          text-anchor="middle"
          letter-spacing="1">للتجارة والتوزيع</text>

    <!-- Decorative Bottom Wings / Flourish in Shield -->
    <path d="M 210 368 Q 256 376 302 368" fill="none" stroke="#fcd34d" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <circle cx="256" cy="374" r="3" fill="#fef08a"/>
  </g>
</svg>
